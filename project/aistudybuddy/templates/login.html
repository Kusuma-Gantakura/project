<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — AI Study Buddy</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    body {
      overflow: hidden;
      background-color: var(--bg);
    }

    .auth-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px
    }

    .right-panel {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .auth-card {
      width: 100%;
      animation: fadeUp .4s ease
    }

    .auth-heading {
      margin-bottom: 32px;
      text-align: center
    }

    .auth-heading h2 {
      font-size: 28px;
      margin-bottom: 6px
    }

    .auth-heading p {
      font-size: 14px
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text3);
      font-size: 12px;
      width: 100%
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .input-wrap {
      position: relative
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 16px;
      pointer-events: none;
      transition: color .2s
    }

    .input-wrap .form-input {
      padding-left: 42px
    }

    .input-wrap:focus-within .input-icon {
      color: var(--indigo2)
    }

    .eye-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color .2s
    }

    .eye-toggle:hover {
      color: var(--text)
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px
    }

    .form-row .form-label {
      margin-bottom: 0
    }

    .forgot-link {
      font-size: 12px;
      color: var(--indigo2)
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text2)
    }

    .auth-footer a {
      color: var(--indigo2);
      font-weight: 600
    }

    .server-error {
      background: rgba(248, 113, 113, .08);
      border: 1px solid rgba(248, 113, 113, .25);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 20px;
      display: none
    }

    .server-error.show {
      display: block
    }
  </style>
</head>

<body>
  <div class="auth-wrap">
    <div class="right-panel">
      <div class="auth-card">
        <div class="auth-heading">
          <h2>Welcome back 👋</h2>
          <p>Sign in to continue your learning journey</p>
        </div>
        <div id="server-error" class="server-error"></div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input class="form-input" type="email" id="email" placeholder="alice@example.com" autocomplete="email"
                required>
            </div>
            <div class="form-error" id="email-err">Please enter a valid email address.</div>
          </div>
          <div class="form-group">
            <div class="form-row">
              <label class="form-label" for="password">Password</label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input class="form-input" type="password" id="password" placeholder="Enter your password"
                autocomplete="current-password" required>
              <button type="button" class="eye-toggle" onclick="toggleEye(this,'password')">👁</button>
            </div>
            <div class="form-error" id="pw-err">Password is required.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Sign In →</button>
        </form>
        <div class="divider">or</div>
        <div class="auth-footer">Don't have an account? <a href="/signup">Create one free →</a></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="/static/js/theme-switcher.js"></script>
  <script>
    function toggleEye(btn, id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; btn.textContent = i.type === 'password' ? '👁' : '🙈' }
    function showToast(msg, type = 'success') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show ' + type; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3500) }
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('server-error');
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      errBox.classList.remove('show');
      let valid = true;
      if (!email || !email.includes('@')) { document.getElementById('email-err').classList.add('show'); document.getElementById('email').classList.add('error'); valid = false }
      if (!password) { document.getElementById('pw-err').classList.add('show'); document.getElementById('password').classList.add('error'); valid = false }
      if (!valid) return;
      btn.textContent = 'Signing in…'; btn.disabled = true;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (data.success) { showToast('Welcome back! 🎉'); setTimeout(() => window.location.href = data.redirect, 600) }
        else { errBox.textContent = data.error || 'Login failed.'; errBox.classList.add('show'); btn.textContent = 'Sign In →'; btn.disabled = false }
      } catch { errBox.textContent = 'Connection error. Is the server running?'; errBox.classList.add('show'); btn.textContent = 'Sign In →'; btn.disabled = false }
    });
  </script>
</body>

</html>
